name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Place layer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The config flow tests need voluptuous, which the flow itself uses.
      # Everything else stubs Home Assistant and runs on stdlib alone.
      - name: Install test dependencies
        run: pip install voluptuous
      # Discovered rather than listed: a test file that exists but is not run
      # is the same failure mode as no test at all, which is how the config
      # flow shipped broken.  Adding tests/test_*.py is enough to gate on it.
      # Every file runs even after one fails, so a single break doesn't hide
      # the rest, and the job still fails if any of them did.
      - name: Tests
        run: |
          status=0
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No test files found under tests/"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::$file"
            python "$file" || status=1
            echo "::endgroup::"
          done
          exit $status

  hassfest:
    name: hassfest (HA integration checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
