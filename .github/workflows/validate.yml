name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Place layer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The config flow tests need voluptuous, which the flow itself uses.
      # Everything else stubs Home Assistant and runs on stdlib alone.
      - name: Install test dependencies
        run: pip install voluptuous
      - name: Manifest
        run: python tests/test_manifest.py
      - name: Zone layer
        run: python tests/test_zone_layer.py
      - name: Hub layer
        run: python tests/test_hub_layer.py
      - name: Config flow
        run: python tests/test_config_flow.py

  hassfest:
    name: hassfest (HA integration checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
